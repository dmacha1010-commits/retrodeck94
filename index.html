<h1>RetroDeck94</h1>
<p>RetroDeck94 は、車載 Android ナビ（ATOTO A5L）向けに個人が開発した、個人利用のための音楽プレーヤーアプリです。</p>
<p>SD カード・USB・Google Drive に保存した自分の音楽ファイルを再生します。Google Drive への接続は読み取り専用で、再生したい曲を端末にダウンロードして再生するために使います。</p>
<p>このアプリは販売・配布を目的としたものではなく、開発者本人が自分の車で使うために作っています。</p>
